<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드소설 제작소</title>
<style>
  :root { --bg: #F5F6FA; --surface: #FFFFFF; --line: #DFE3EC; --text: #1A1C23; --muted: #5F6577; --primary: #9E2B3E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121419; --surface: #1B1E26; --line: #313644; --text: #E8EAF1; --muted: #9AA1B4; --primary: #E37A8B; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px; max-width: 420px; text-align: center; }
  h1 { font: 700 20px "Noto Serif KR", "Apple Myungjo", Batang, serif; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { height: 38px; padding: 0 18px; border-radius: 19px; border: 0; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>카드소설 제작소</h1>
    <p>처음 열 때는 인터넷 연결이 필요해요. 한 번 열고 나면 연결이 없어도 쓸 수 있어요.</p>
    <button id="retry" type="button">다시 시도</button>
  </div>
<script>
  const target = new URLSearchParams(location.search).get('url') || 'https://cardnovel.vercel.app/';
  document.getElementById('retry').addEventListener('click', () => { location.href = target; });
  window.addEventListener('online', () => { location.href = target; });
</script>
</body>
</html>
