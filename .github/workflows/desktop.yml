name: Desktop installers

# Builds the macOS (.dmg), Windows (.exe) and Ubuntu (.deb, .AppImage) installers and publishes them on
# the GitHub release "desktop-v<version>" (version from desktop/package.json). The release and its tag are
# created on the first build of a version; later builds of the same version replace the files.
on:
  workflow_dispatch:
  push:
    branches: ['claude/amazing-edison-vlnc9l', 'main']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: --mac }
          - { name: Windows, os: windows-latest, args: --win }
          - { name: Ubuntu, os: ubuntu-latest, args: --linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Smoke test (the app opens cardnovel.vercel.app and shows 20 cards)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the macOS app the way a user gets it (copied out of the dmg)
        if: runner.os == 'macOS'
        run: |
          set -x
          DMG=$(ls dist/*-mac-arm64.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          rm -rf /tmp/inst && mkdir -p /tmp/inst
          cp -R "$MNT"/*.app /tmp/inst/
          hdiutil detach "$MNT"
          APP=$(ls -d /tmp/inst/*.app)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ls "$APP/Contents/MacOS" "$APP/Contents/Frameworks"
          file "$APP/Contents/MacOS/$EXE"
          codesign -dv --verbose=2 "$APP" 2>&1
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/$EXE" --smoke-test
          # what Gatekeeper says about a downloaded copy (informational: the app has no Apple Developer ID)
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$APP"
          spctl --assess --type execute -vv "$APP" || true
          syspolicy_check distribution "$APP" || true
      - uses: actions/upload-artifact@v4
        with:
          name: CardNovel-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false
      - name: Release tag from the desktop version
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=desktop-v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: 카드소설 제작소 ${{ steps.tag.outputs.name }}
          make_latest: true
          files: out/*
          body: |
            카드소설 제작소 데스크톱 설치 파일입니다. 앱은 https://cardnovel.vercel.app 을 띄우므로 웹이 바뀌면 자동으로 최신이 됩니다. 처음 열 때만 인터넷이 필요합니다.

            | 운영체제 | 받을 파일 |
            | --- | --- |
            | macOS (Apple Silicon, M1 이후) | `CardNovel-*-mac-arm64.dmg` |
            | Windows | `CardNovel-*-win-x64.exe` |
            | Ubuntu | `CardNovel-*-linux-amd64.deb` 또는 `CardNovel-*-linux-x86_64.AppImage` |

            **처음 열 때 경고가 뜹니다** (Apple·Microsoft 개발자 서명이 없어서입니다)
            - macOS: 처음 열면 막힙니다. 시스템 설정 → 개인정보 보호 및 보안 → 「그래도 열기」.
            - Windows: 'Windows의 PC 보호' 창에서 「추가 정보」 → 「실행」.
            - Ubuntu: `.deb`는 더블클릭하거나 `sudo apt install ./CardNovel-*-linux-amd64.deb`. AppImage는 실행 권한을 준 뒤 실행.

            데스크톱 앱의 작품과 API 키는 브라우저와 따로 저장됩니다. 옮기려면 보관함의 「내보내기」 → 「가져오기」를 쓰세요.
