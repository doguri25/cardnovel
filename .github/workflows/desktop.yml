name: Desktop installers

# Builds the macOS (.dmg), Windows (.exe) and Ubuntu (.deb, .AppImage) installers and publishes them on
# the GitHub release "desktop-v<version>" (version from desktop/package.json). The release and its tag are
# created on the first build of a version; later builds of the same version replace the files.
on:
  workflow_dispatch:
  push:
    branches: ['claude/amazing-edison-vlnc9l', 'main']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: --mac }
          - { name: Windows, os: windows-latest, args: --win }
          - { name: Ubuntu, os: ubuntu-latest, args: --linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Smoke test (the app opens cardnovel.vercel.app and shows 20 cards)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # every installer is launched once on its own OS: it must open cardnovel.vercel.app and show 20 cards
      - name: Smoke test the packaged app (macOS, copied out of the dmg the way a user does)
        if: runner.os == 'macOS'
        run: |
          set -x
          MNT=$(mktemp -d)
          hdiutil attach dist/*-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MNT"
          rm -rf /tmp/inst && mkdir -p /tmp/inst && cp -R "$MNT"/*.app /tmp/inst/
          hdiutil detach "$MNT"
          APP=$(ls -d /tmp/inst/*.app)
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")" --smoke-test
          # what Gatekeeper says about a downloaded copy (the app has no Apple Developer ID, so it is rejected until "Open Anyway")
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$APP"
          spctl --assess --type execute -vv "$APP" || true
      - name: Smoke test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./dist/win-unpacked/CardNovel.exe --smoke-test
      - name: Smoke test the packaged app (Ubuntu)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/linux-unpacked/cardnovel --smoke-test --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: CardNovel-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false
      - name: Release tag from the desktop version
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=desktop-v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: 카드소설 제작소 ${{ steps.tag.outputs.name }}
          make_latest: true
          files: out/*
          body: |
            카드소설 제작소 데스크톱 설치 파일입니다. 앱은 https://cardnovel.vercel.app 을 띄우므로 웹이 바뀌면 자동으로 최신이 됩니다. 처음 열 때만 인터넷이 필요합니다.

            | 운영체제 | 받을 파일 |
            | --- | --- |
            | macOS (Apple Silicon, M1 이후) | `CardNovel-*-mac-arm64.dmg` |
            | Windows | `CardNovel-*-win-x64.exe` |
            | Ubuntu | `CardNovel-*-linux-amd64.deb` 또는 `CardNovel-*-linux-x86_64.AppImage` |

            **처음 열 때 경고가 뜹니다** (Apple·Microsoft 개발자 서명이 없어서입니다)
            - macOS: dmg를 열고 `CardNovel`을 응용 프로그램 폴더로 끌어 넣습니다. 처음 열면 「열리지 않음」 창이 뜨면 「완료」를 누르고, 시스템 설정 → 개인정보 보호 및 보안 → 맨 아래 「그래도 열기」 → 암호 입력 → 다시 「그래도 열기」. 한 번만 하면 됩니다.
            - macOS에서 「손상되었기 때문에 열 수 없습니다」가 뜨면 터미널에서 `xattr -cr /Applications/CardNovel.app` 을 실행한 뒤 다시 엽니다.
            - Windows: 'Windows의 PC 보호' 창에서 「추가 정보」 → 「실행」.
            - Ubuntu: `.deb`는 더블클릭하거나 `sudo apt install ./CardNovel-*-linux-amd64.deb`. AppImage는 실행 권한을 준 뒤 실행.

            0.1.1: macOS 앱이 실행되자마자 꺼지던 문제를 고쳤습니다(앱 파일 이름을 영문 `CardNovel`로 바꿈). 0.1.0의 macOS 파일은 쓰지 마세요.

            데스크톱 앱의 작품과 API 키는 브라우저와 따로 저장됩니다. 옮기려면 보관함의 「내보내기」 → 「가져오기」를 쓰세요.
